<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Tecnico - Stazione Meteo ESP32</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --accent: #0ea5e9;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
            color: #1e293b;
            background: white;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 30px;
            position: relative;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        .summary-item {
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .chart-card {
            border: 1px solid var(--border);
            padding: 15px;
            height: 320px;
            border-radius: 8px;
            page-break-inside: avoid;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .chart-card h4 {
            margin: 0 0 8px 0;
            font-size: 1rem;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            color: var(--accent);
        }

        .close-window {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            background: #fff;
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            color: var(--accent);
            padding: 8px;
            border-radius: 6px;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                padding: 10mm;
            }

            .chart-card {
                height: 280px;
            }

            .table-container {
                overflow: visible;
            }

            table {
                min-width: auto;
            }
        }
    </style>
</head>

<body>

    <button class="no-print close-window" title="Chiudi" onclick="window.close()">
        <i class="fas fa-times"></i>
    </button>

    <div class="no-print" style="text-align:right; margin-bottom: 20px;">
        <button onclick="window.print()"
            style="padding: 12px 20px; cursor:pointer; background: var(--accent); color:white; border:none; border-radius:5px; font-weight: bold;">
            <i class="fas fa-print"></i> STAMPA / SALVA PDF
        </button>
    </div>

    <header>
        <div>
            <h1 style="margin:0; color: var(--accent); font-size: 1.5rem;">REPORT METEO ESP32</h1>
            <p id="genDate" style="color:#64748b; margin-top:5px; font-size: 0.9rem;"></p>
        </div>
        <div style="font-size: 0.9rem;">
            <strong>Sistema:</strong> ESP32-WROOM<br>
            <strong>FW:</strong> 2.3-ASYNC-PRO
        </div>
    </header>

    <div class="summary-grid" id="summaryBox"></div>
    <div class="report-grid" id="chartsGrid"></div>

    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Ora</th>
                    <th>Temp (°C)</th>
                    <th>Hum (%)</th>
                    <th>Press (hPa)</th>
                    <th>IAQ</th>
                    <th>CO2 (ppm)</th>
                    <th>PM2.5</th>
                    <th>UV</th>
                    <th>Vento (km/h)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const rawData = localStorage.getItem('printData');
            if (!rawData) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>Errore: Nessun dato trovato.</h1>";
                return;
            }

            const data = JSON.parse(rawData);
            document.getElementById('genDate').innerText = "Generato il: " + new Date().toLocaleString();

            const allSets = [
                { k: 'temp', n: 'Temperatura', c: '#ef4444' },
                { k: 'hum', n: 'Umidità', c: '#3b82f6' },
                { k: 'press_mb', n: 'Pressione', c: '#f59e0b' },
                { k: 'iaq', n: 'Qualità Aria', c: '#10b981' },
                { k: 'co2', n: 'CO2', c: '#a855f7' },
                { k: 'pm25', n: 'PM2.5', c: '#64748b' },
                { k: 'uv', n: 'Indice UV', c: '#fbbf24' },
                { k: 'wind', n: 'Vento', c: '#0ea5e9' }
            ];
            // 2. FILTRAGGIO: Se data.soloQuesto esiste ed è valido, prendiamo solo quello. 
            // Altrimenti (se apri la stampa generale) li prendiamo tutti.
            let sets = (data.soloQuesto && data.soloQuesto !== "")
                ? allSets.filter(s => s.k === data.soloQuesto)
                : allSets;

            // 3. Controllo di sicurezza: se il filtro svuota l'array per errore, mostra tutto
            if (sets.length === 0) sets = allSets;
            // Funzione utility per i valori
            function safeVal(arr, idx) {
                return (arr && arr[idx] !== undefined) ? arr[idx] : '--';
            }

            // 1. Filtro sensore singolo
            // if (data.soloQuesto) {
            //   sets = sets.filter(item => item.k === data.soloQuesto);
            //  }

            // 2. Box Riassuntivi
            const summaryBox = document.getElementById('summaryBox');
            summaryBox.innerHTML = '';
            sets.forEach(s => {
                const arr = data[s.k] || [];
                const last = arr.length ? arr[arr.length - 1] : '--';
                const item = document.createElement('div');
                item.className = 'summary-item';
                item.innerHTML = `
                    <strong style="color:${s.c}">${s.n}</strong>
                    <div style="font-size:1.4rem; font-weight:bold; margin-top:8px;">${last}</div>
                `;
                summaryBox.appendChild(item);
            });

            // 3. Tabella Dati
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.labels.forEach((label, i) => {
                const row = `<tr>
                    <td>${label || ''}</td>
                    <td>${safeVal(data.temp, i)}</td>
                    <td>${safeVal(data.hum, i)}</td>
                    <td>${safeVal(data.press_mb, i)}</td>
                    <td>${safeVal(data.iaq, i)}</td>
                    <td>${safeVal(data.co2, i)}</td>
                    <td>${safeVal(data.pm25, i)}</td>
                    <td>${safeVal(data.uv, i)}</td>
                    <td>${safeVal(data.wind, i)}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });

            // 4. Grafici
            const chartsGrid = document.getElementById('chartsGrid');
            const chartPromises = sets.map((s, idx) => {
                return new Promise(resolve => {
                    const card = document.createElement('div');
                    card.className = 'chart-card';
                    card.innerHTML = `<h4>Andamento ${s.n}</h4><div class="chart-wrapper"><canvas id="chart_${s.k}"></canvas></div>`;
                    chartsGrid.appendChild(card);

                    setTimeout(() => {
                        const canvasEl = document.getElementById(`chart_${s.k}`);
                        if (canvasEl) {
                            new Chart(canvasEl.getContext('2d'), {
                                type: 'line',
                                data: {
                                    labels: data.labels,
                                    datasets: [{
                                        label: s.n,
                                        data: (data[s.k] || []),
                                        borderColor: s.c,
                                        fill: true,
                                        backgroundColor: s.c + '10',
                                        tension: 0.3
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: { legend: { display: false } },
                                    scales: {
                                        x: { ticks: { font: { size: 10 }, maxRotation: 45, maxTicksLimit: 10 }, grid: { display: false } },
                                        y: { ticks: { font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } }
                                    }
                                }
                            });
                        }
                        resolve(true);
                    }, idx * 80);
                });
            });

            // 5. Gestione Stampa Automatica
            Promise.all(chartPromises).then(() => {
                if (localStorage.getItem('autoPrint') === '1') {
                    localStorage.removeItem('autoPrint');
                    setTimeout(() => { window.print(); }, 1500);
                }
            });
        });
    </script>
</body>

</html>
