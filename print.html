<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Tecnico - Stazione Meteo ESP32</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --accent: #0ea5e9;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
            color: #1e293b;
            background: white;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 30px;
            position: relative;
        }

        /* Ottimizzazione Grid per Mobile: da 4 colonne a 2 o 1 su schermi piccoli */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        .summary-item {
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .chart-card {
            border: 1px solid var(--border);
            padding: 15px;
            height: 320px;
            border-radius: 8px;
            page-break-inside: avoid;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .chart-card h4 {
            margin: 0 0 8px 0;
            font-size: 1rem;
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
        }

        /* Ottimizzazione Tabella per Mobile (Scroll orizzontale se necessario) */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            color: var(--accent);
        }

        .close-window {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            background: #fff;
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            color: var(--accent);
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                padding: 10mm;
            }

            .chart-card {
                height: 280px;
            }

            .close-window {
                display: none !important;
            }

            .table-container {
                overflow: visible;
            }

            table {
                min-width: auto;
            }
        }
    </style>
</head>

<body>

    <button class="no-print close-window" title="Chiudi" onclick="window.close()">
        <i class="fas fa-times"></i>
    </button>

    <div class="no-print" style="text-align:right; margin-bottom: 20px;">
        <button onclick="window.print()"
            style="padding: 12px 20px; cursor:pointer; background: var(--accent); color:white; border:none; border-radius:5px; font-weight: bold;">
            <i class="fas fa-print"></i> STAMPA / SALVA PDF
        </button>
    </div>

    <header>
        <div>
            <h1 id="reportTitle" style="margin:0; color: var(--accent); font-size: 1.5rem;">REPORT METEO ESP32</h1>
            <p id="genDate" style="color:#64748b; margin-top:5px; font-size: 0.9rem;"></p>
        </div>
        <div style="font-size: 0.9rem;">
            <strong>Sistema:</strong> ESP32-WROOM<br>
            <strong>FW:</strong> 2.3-ASYNC-PRO
        </div>
    </header>

    <div class="summary-grid" id="summaryBox"></div>

    <div class="report-grid" id="chartsGrid"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ora</th>
                    <th>Temp (°C)</th>
                    <th>Hum (%)</th>
                    <th>Press (hPa)</th>
                    <th>IAQ</th>
                    <th>CO2 (ppm)</th>
                    <th>PM2.5</th>
                    <th>UV</th>
                    <th>Vento (km/h)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // 1. Recupero dati dall'URL (Metodo robusto per Firefox e PC locale)
        const urlParams = new URLSearchParams(window.location.search);
        const dataEncoded = urlParams.get('data');
        let data = null;

        if (dataEncoded) {
            try {
                // Decodifica super-compatibile per gestire simboli come °C e accenti
                data = JSON.parse(decodeURIComponent(escape(atob(dataEncoded))));
            } catch (e) {
                console.error("Errore decodifica URL:", e);
                // Fallback se la decodifica speciale fallisce
                try { data = JSON.parse(atob(dataEncoded)); } catch (e2) { }
            }
        }

        // 2. Se i dati sono validi, costruiamo il report
        if (data && data.l) {
            document.getElementById('genDate').textContent = "Documento generato il: " + new Date().toLocaleString('it-IT');

            // Aggiorniamo il titolo del report col nome del sensore
            const reportTitle = document.getElementById('reportTitle');
            if (reportTitle) reportTitle.textContent = "ANALISI: " + data.n;

            // Box riassuntivo per il GPS
            const summaryBox = document.getElementById('summaryBox');
            if (summaryBox) {
                summaryBox.innerHTML = `
                <div class="summary-item" style="grid-column: span 4;">
                    <strong>Coordinate GPS Rilevate</strong>
                    <div style="font-size:1.2rem; margin-top:8px; color:#0ea5e9;">${data.g || '--'}</div>
                </div>`;
            }

            // Prepariamo l'area del grafico
            const chartsGrid = document.getElementById('chartsGrid');
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.style.height = "450px";
            card.innerHTML = `<div class="chart-wrapper"><canvas id="mainChart"></canvas></div>`;
            chartsGrid.appendChild(card);

            // 3. Disegniamo il grafico con SCALE NERE (Fondamentale per la stampa)
            setTimeout(() => {
                const ctx = document.getElementById('mainChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.l,
                        // Dentro print.html
                        datasets: [{
                            label: data.n,
                            data: data.v,
                            borderColor: data.c || '#0ea5e9', // Usa il colore del sensore passato
                            backgroundColor: (data.c || '#0ea5e9') + '33',
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: { left: 50, right: 20, top: 20, bottom: 50 }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#000000', font: { size: 12, weight: 'bold' } },
                                grid: { color: 'rgba(0, 0, 0, 0.1)' }
                            },
                            y: {
                                ticks: { color: '#000000', font: { size: 12, weight: 'bold' } },
                                grid: { color: 'rgba(0, 0, 0, 0.1)' }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#000000' } }
                        }
                    }, // <--- LA VIRGOLA CHE MANCAVA È QUI
                });

                // 4. Lancio automatico della stampa dopo 1 secondo
                setTimeout(() => { window.print(); }, 1000);
            }, 100);

        } else {
            // Messaggio di errore se non arrivano dati
            document.body.innerHTML = `
            <div style="text-align:center; padding:50px; font-family:sans-serif;">
                <h1>⚠️ Dati non ricevuti</h1>
                <p>Torna alla dashboard, apri un sensore e clicca su 'Stampa Record'.</p>
                <small>Assicurati di usare l'ultima versione di script.js</small>
            </div>`;
        }
    </script>
</body>

</html>
